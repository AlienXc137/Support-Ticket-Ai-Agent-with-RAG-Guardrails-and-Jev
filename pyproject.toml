[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AlienXc137", email = "azharahmad0704@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "nemoguardrails>=0.24.1",
    "openai>=3.22.1",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8.16",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "tavily-python>=0.8.4",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
support-ticket-agent = "support_ticket_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
